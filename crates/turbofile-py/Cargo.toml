[package]
name = "turbofile-py"
description = "Python bindings for turbofile (extension module turbofile._turbofile)"
# Distributed as wheels on PyPI via maturin, never as a crate.
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "_turbofile"
crate-type = ["cdylib"]

[dependencies]
turbofile-core = { path = "../turbofile-core" }
pyo3 = { version = "0.25", features = ["abi3-py312"] }

# Page-cache fast path: preadv2(RWF_NOWAIT) on Linux, mincore + pread on Darwin.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# Calibration probe only: measures the floor of an inline (no thread hop)
# submission design against the current bridge. Not on any production path.
[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7"
